{% extends "base.html" %}
{% block title %}Forgot Password — Folixo{% endblock %}
{% block extra_css %}
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;background:var(--bg);padding:80px 0;}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px;max-width:440px;width:100%;margin:0 auto;box-shadow:var(--sh2);animation:fadeUp .5s ease both;text-align:center;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.auth-icon{width:64px;height:64px;border-radius:18px;background:var(--bg3);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;color:var(--p);}
.auth-title{font-size:22px;font-weight:800;color:var(--txt);margin-bottom:6px;}
.auth-sub{font-size:14px;color:var(--muted);margin-bottom:28px;}
.fl{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;text-align:left;}
.fl label{font-size:12px;font-weight:600;color:var(--txt2);}
.fi{width:100%;padding:10px 14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;color:var(--txt);font-size:14px;outline:none;transition:all .3s;}
.fi:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(108,63,197,.15);}
.btn-submit{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:15px;border:none;cursor:pointer;transition:all .3s;margin-top:4px;}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(108,63,197,.3);}
.back-link{display:block;margin-top:16px;font-size:13px;color:var(--muted);}
.back-link a{color:var(--p);font-weight:600;}
</style>
{% endblock %}
{% block content %}
<div class="auth-page">
<div class="container">
<div class="auth-card">
  <div class="auth-icon"><i class="bi bi-envelope-open"></i></div>
  <div class="auth-title">Forgot Password?</div>
  <div class="auth-sub">Enter your registered email — we'll verify your identity through security questions.</div>
  <form method="POST">
    <div class="fl"><label>Email Address</label><input type="email" name="email" class="fi" placeholder="zain@example.com" required/></div>
    <button type="submit" class="btn-submit"><i class="bi bi-shield-check me-2"></i>Continue to Verification</button>
  </form>
  <div class="back-link"><a href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left me-1"></i>Back to Login</a></div>
</div>
</div>
</div>
{% endblock %}
