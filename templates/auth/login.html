{% extends "base.html" %}
{% block title %}Login — Folixo{% endblock %}
{% block extra_css %}
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;background:var(--bg);padding:80px 0 40px;}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px;max-width:440px;width:100%;margin:0 auto;box-shadow:var(--sh2);animation:fadeUp .5s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{text-align:center;margin-bottom:24px;}
.auth-title{font-size:22px;font-weight:800;color:var(--txt);margin-bottom:4px;}
.auth-sub{font-size:14px;color:var(--muted);margin-bottom:28px;}
.fl{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;}
.fl label{font-size:12px;font-weight:600;color:var(--txt2);}
.fi{width:100%;padding:10px 14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;color:var(--txt);font-size:14px;outline:none;transition:all .3s;}
.fi:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(108,63,197,.15);}
.pw-wrap{position:relative;}.pw-wrap .fi{padding-right:40px;}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:16px;}
.check-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.check-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt2);cursor:pointer;}
.check-label input{accent-color:var(--p);width:15px;height:15px;}
.forgot{font-size:13px;color:var(--p);font-weight:600;}
.btn-submit{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:15px;border:none;cursor:pointer;transition:all .3s;}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(108,63,197,.3);}
.auth-foot{text-align:center;margin-top:16px;font-size:14px;color:var(--muted);}
.auth-foot a{color:var(--p);font-weight:600;}
</style>
{% endblock %}
{% block content %}
<div class="auth-page">
<div class="container">
<div class="auth-card">
  <div class="auth-logo">
    <svg viewBox="0 0 180 44" width="130" height="32" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#6c3fc5"><animate attributeName="stop-color" values="#6c3fc5;#9333ea;#6c3fc5" dur="4s" repeatCount="indefinite"/></stop><stop offset="100%" stop-color="#fb923c"><animate attributeName="stop-color" values="#fb923c;#f472b6;#fb923c" dur="4s" repeatCount="indefinite"/></stop></linearGradient></defs>
      <rect x="1" y="2" width="40" height="40" rx="11" fill="#6c3fc5"><animate attributeName="rx" values="11;15;11" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="10" y="11" width="21" height="4" rx="2" fill="white"/><rect x="10" y="19" width="15" height="4" rx="2" fill="white"/><rect x="10" y="11" width="4" height="20" rx="2" fill="white"/>
      <text x="50" y="32" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="22" fill="url(#lg)">olixo</text>
      <circle cx="88" cy="14" r="3" fill="#fb923c"><animate attributeName="r" values="3;4.5;3" dur="2s" repeatCount="indefinite"/></circle>
    </svg>
  </div>
  <div class="text-center">
    <div class="auth-title">Welcome back 👋</div>
    <div class="auth-sub">Login to continue building amazing documents</div>
  </div>
  <form method="POST">
    <div class="fl"><label>Email Address</label><input type="email" name="email" class="fi" placeholder="zain@example.com" value="{{ email }}" required/></div>
    <div class="fl">
      <label>Password</label>
      <div class="pw-wrap"><input type="password" name="password" class="fi" id="pw" placeholder="Your password" required/><i class="bi bi-eye pw-eye" id="eye"></i></div>
    </div>
    <div class="check-row">
      <label class="check-label"><input type="checkbox" name="remember"/>Remember me</label>
      <a href="{{ url_for('auth.forgot_password') }}" class="forgot">Forgot password?</a>
    </div>
    <button type="submit" class="btn-submit"><i class="bi bi-box-arrow-in-right me-2"></i>Login to Folixo</button>
  </form>
  <div class="auth-foot">Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up free</a></div>
</div>
</div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.getElementById('eye').addEventListener('click',()=>{
  const i=document.getElementById('pw');
  i.type=i.type==='password'?'text':'password';
  document.getElementById('eye').className=`bi bi-eye${i.type==='password'?'':'-slash'} pw-eye`;
});
</script>
{% endblock %}
