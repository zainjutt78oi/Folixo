{% extends "base.html" %}
{% block title %}Reset Password — Folixo{% endblock %}
{% block extra_css %}
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;background:var(--bg);padding:80px 0;}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px;max-width:440px;width:100%;margin:0 auto;box-shadow:var(--sh2);animation:fadeUp .5s ease both;text-align:center;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.auth-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;color:#fff;}
.auth-title{font-size:22px;font-weight:800;color:var(--txt);margin-bottom:6px;}
.auth-sub{font-size:14px;color:var(--muted);margin-bottom:28px;}
.fl{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;text-align:left;}
.fl label{font-size:12px;font-weight:600;color:var(--txt2);}
.pw-wrap{position:relative;}.pw-wrap .fi{padding-right:40px;}
.fi{width:100%;padding:10px 14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;color:var(--txt);font-size:14px;outline:none;transition:all .3s;}
.fi:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(108,63,197,.15);}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:16px;}
.str-bar{height:4px;border-radius:2px;background:var(--bg3);margin-top:5px;overflow:hidden;}
.str-fill{height:100%;border-radius:2px;transition:all .4s;}
.str-txt{font-size:11px;color:var(--muted);margin-top:3px;}
.btn-submit{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:700;font-size:15px;border:none;cursor:pointer;transition:all .3s;margin-top:4px;}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(34,197,94,.3);}
</style>
{% endblock %}
{% block content %}
<div class="auth-page">
<div class="container">
<div class="auth-card">
  <div class="auth-icon"><i class="bi bi-key"></i></div>
  <div class="auth-title">Set New Password</div>
  <div class="auth-sub">All 3 questions verified! Choose a strong new password.</div>
  <form method="POST">
    <div class="fl">
      <label>New Password</label>
      <div class="pw-wrap"><input type="password" name="password" class="fi" id="p1" placeholder="Min. 8 characters" required/><i class="bi bi-eye pw-eye" id="e1"></i></div>
      <div class="str-bar"><div class="str-fill" id="sf"></div></div>
      <div class="str-txt" id="st"></div>
    </div>
    <div class="fl">
      <label>Confirm Password</label>
      <div class="pw-wrap"><input type="password" name="confirm_password" class="fi" id="p2" placeholder="Repeat password" required/><i class="bi bi-eye pw-eye" id="e2"></i></div>
    </div>
    <button type="submit" class="btn-submit"><i class="bi bi-check-circle me-2"></i>Reset Password</button>
  </form>
</div>
</div>
</div>
{% endblock %}
{% block extra_js %}
<script>
[['p1','e1'],['p2','e2']].forEach(([id,eid])=>{
  document.getElementById(eid).addEventListener('click',()=>{const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';document.getElementById(eid).className=`bi bi-eye${i.type==='password'?'':'-slash'} pw-eye`;});
});
document.getElementById('p1').addEventListener('input',function(){
  const v=this.value;let s=0;
  if(v.length>=8)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
  const L=[{p:'0%',c:'transparent',t:''},{p:'25%',c:'#ef4444',t:'Weak'},{p:'50%',c:'#f59e0b',t:'Fair'},{p:'75%',c:'#3b82f6',t:'Good'},{p:'100%',c:'#22c55e',t:'Strong ✓'}][s];
  document.getElementById('sf').style.cssText=`width:${L.p};background:${L.c}`;
  document.getElementById('st').textContent=L.t;
});
</script>
{% endblock %}
