<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Login — Folixo</title>
<link rel="icon" href="/static/images/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: #04040e;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ece9ff;
}
.card {
  background: #0f0f24;
  border: 1px solid rgba(99,56,210,.3);
  border-radius: 20px;
  padding: 40px;
  width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,.8);
}
.logo {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: linear-gradient(135deg, #6338d2, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; color: #fff;
  margin: 0 auto 16px;
  box-shadow: 0 4px 16px rgba(99,56,210,.5);
}
h2 { text-align: center; font-size: 20px; font-weight: 800; margin-bottom: 4px; }
p  { text-align: center; font-size: 12px; color: #3d395c; margin-bottom: 24px; }
.err {
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.25);
  border-radius: 8px; padding: 10px 14px;
  font-size: 12px; color: #f87171; margin-bottom: 16px;
}
label {
  display: block; font-size: 11px; font-weight: 600;
  color: #8880b0; text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 5px;
}
input {
  width: 100%; padding: 10px 14px;
  background: #080818;
  border: 1.5px solid rgba(99,56,210,.2);
  border-radius: 9px; color: #ece9ff;
  font-size: 13px; outline: none;
  margin-bottom: 14px; font-family: inherit;
  transition: border-color .3s;
}
input:focus { border-color: #6338d2; }
button {
  width: 100%; padding: 12px;
  border-radius: 10px;
  background: linear-gradient(135deg, #6338d2, #8b5cf6);
  color: #fff; font-weight: 700; font-size: 14px;
  border: none; cursor: pointer; transition: all .3s;
}
button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,56,210,.5); }
.hint {
  background: rgba(99,56,210,.08);
  border: 1px solid rgba(99,56,210,.15);
  border-radius: 8px; padding: 10px 14px;
  font-size: 11px; color: #8880b0;
  margin-bottom: 18px; line-height: 1.7;
}
.back { text-align: center; margin-top: 18px; font-size: 12px; color: #3d395c; }
.back a { color: #6338d2; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">F</div>
  <h2>Admin Panel</h2>
  <p>Folixo Control Panel — Authorized only</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <div class="hint">
    Email: <strong style="color:#a78bfa;">admin@folixo.com</strong><br>
    Password: <strong style="color:#a78bfa;">Admin@Folixo2024!</strong>
  </div>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" placeholder="admin@folixo.com" required autofocus/>
    <label>Password</label>
    <input type="password" name="password" placeholder="Password" required/>
    <button type="submit">Login to Admin Panel</button>
  </form>
  <div class="back"><a href="/">← Back to Folixo</a></div>
</div>
</body>
</html>
